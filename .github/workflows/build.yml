name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check the cloud server starts
        shell: pwsh
        working-directory: server
        run: |
          $env:DEV_LOGIN = '1'; $env:DATA_DIR = "$env:RUNNER_TEMP\clutch-cloud"
          $p = Start-Process node -ArgumentList '--no-warnings','src/index.mjs' -PassThru -NoNewWindow
          Start-Sleep 3
          $r = Invoke-RestMethod http://127.0.0.1:8787/health
          Stop-Process $p.Id
          if (-not $r.ok) { throw 'server health check failed' }

      - name: Bundle FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      # Signs with Azure Artifact Signing when the AZURE_* secrets exist; unsigned otherwise.
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Tags (v0.2.0 ...) publish a GitHub release with latest.yml: that's what auto-update reads.
      # electron-builder uploads files in parallel and each upload tries to create a missing release,
      # which fails with "already_exists". Create it first as a draft (auto-update ignores drafts),
      # upload into it, and only publish once every file is there.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --draft --title "Clutch ${tag#v}" --generate-notes

      - name: Build and upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for f in "Clutch-Setup-${tag#v}.exe" latest.yml; do
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$f" || { echo "missing $f in release"; exit 1; }
          done
          # A copy with a fixed name, so "releases/latest/download/Clutch-Setup.exe" (the README's
          # download button) always gets the newest installer. Updates use the versioned file.
          cp "release/Clutch-Setup-${tag#v}.exe" release/Clutch-Setup.exe
          gh release upload "$tag" release/Clutch-Setup.exe --clobber
          gh release edit "$tag" --draft=false --latest

      - uses: actions/upload-artifact@v7
        with:
          name: Clutch-Setup
          path: release/*.exe
