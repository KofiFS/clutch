name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check the cloud server starts
        shell: pwsh
        working-directory: server
        run: |
          $env:DEV_LOGIN = '1'; $env:DATA_DIR = "$env:RUNNER_TEMP\clutch-cloud"
          $p = Start-Process node -ArgumentList '--no-warnings','src/index.mjs' -PassThru -NoNewWindow
          Start-Sleep 3
          $r = Invoke-RestMethod http://127.0.0.1:8787/health
          Stop-Process $p.Id
          if (-not $r.ok) { throw 'server health check failed' }

      - name: Bundle FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Clutch-Setup
          path: release/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
